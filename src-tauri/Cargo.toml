[package]
name = "autofirme-desktop"
version = "0.1.2"
description = "AutoFirme Web desktop shell"
edition = "2021"
rust-version = "1.90"

[lib]
name = "autofirme_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# P1.4a smartcard layer (Refs #98): PC/SC reader/session plus the OpenSC PKCS#11
# sign path, absorbed as the `smartcard` module of the desktop lib.
cryptoki = "0.12.1"
pcsc = "2.9"
quinn = "0.11.12"
mdns-sd = "0.21.6"
rcgen = "0.14.10"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "time", "io-util", "sync", "macros", "fs"] }
rustls = { version = "0.23.46", features = ["ring"] }
