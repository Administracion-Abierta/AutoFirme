[package]
name = "autofirme-desktop"
version = "0.1.2"
description = "AutoFirme Web desktop shell"
edition = "2021"
rust-version = "1.90"

[lib]
name = "autofirme_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# P1.4a smartcard layer (Refs #98): PC/SC reader/session plus the OpenSC PKCS#11
# sign path, absorbed as the `smartcard` module of the desktop lib.
cryptoki = "0.12.1"
pcsc = "2.9"
# P2.2a loopback sign server, protocol 3 (Refs #104): axum WebSocket on
# 127.0.0.1:63117 behind rustls; per-install self-signed cert via rcgen.
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# TLS WebSocket client for the server round-trip tests (Refs #104).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
