name: Develop release

# Every push to develop ships a pre-release tagged dev-<short-sha>: the rolling
# test channel for the extension zip, the static site and the container image.
# Production releases keep coming from release-please on main (release.yml).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: develop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: build and publish dev-<commit> release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:extension
      - run: pnpm package:extension
      - name: Pack the static site
        run: tar -czf dist/autofirme-web-dev.tar.gz -C build .
      - name: Create the development pre-release tagged dev-<short-sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |-
            :construction: **Development build — not for production use.**

            Rolling pre-release of the `develop` branch, rebuilt on every push. It can break or change format without notice; signatures are real but the surrounding UX and formats may drift between builds. Use the latest stable release for anything that matters.

            - Commit: ${{ github.sha }}
            - Extension (Chrome only for now): `autofirme-extension-*.zip` — load unpacked or install manually; unsigned, so developer mode is required.
            - Static site: `autofirme-web-dev.tar.gz` — serve the extracted folder with any static host.
            - Container image: `ghcr.io/administracion-abierta/autofirme:dev` and `:dev-${GITHUB_SHA::7}`.

            Verify with `SHA256SUMS` before installing.
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "[Development build] $TAG — unstable, for testing only" \
            --notes "$NOTES" \
            dist/autofirme-extension-*.zip dist/SHA256SUMS dist/autofirme-web-dev.tar.gz
          echo "release $TAG created"

  image:
    name: push dev site image to ghcr.io
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: Containerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lower }}:dev,ghcr.io/${{ steps.repo.outputs.lower }}:dev-${{ github.sha }}
          # self-host (k3s) es x86_64; anyadir platforms aqui si aparece destino arm.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
