name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Debian trixie (OpenSSL 3.5) instead of the runner image (OpenSSL 3.0: the fixture
    # generator in src/test/fixtures.ts needs >= 3.4 for `-not_before`/`-not_after`).
    container:
      image: debian:trixie
    steps:
      # The image is minimal and checkout needs git, so the toolchain comes first.
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git openssl unzip zip python3 ca-certificates xmlsec1 libxml2-utils
          # The workspace is mounted from the host; without this, git refuses to read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          openssl version
          xmlsec1 --version
          xmllint --version
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # package.json and extension/manifest.json must agree before anything is packaged.
      - run: pnpm check:versions
      # Webapp plus extension suites; the extension tests need no build output.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:extension
      - run: pnpm check:extension
      # Cross-checks against tools that did not write the artifacts: Info-ZIP for
      # the batch archive, openssl/python3 for every fixture (positive and negative).
      - run: pnpm verify:zip
      - run: bash test/fixtures/verify-fixtures.sh
      - run: pnpm package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: autofirme-extension
          path: |
            dist/autofirme-extension-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # The node sidecar used to run in no workflow at all; it is part of the pnpm
  # workspace now, so the same install covers it.
  mcp:
    name: mcp check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter autofirme-mcp check
      - run: pnpm --filter autofirme-mcp build
      - run: pnpm --filter autofirme-mcp test

  # P0 shell gate (#19): Rocky 9.8 ships only webkit2gtk 4.0, which wry cannot use,
  # so the shell is checked on the 24.04 runner (webkit2gtk-4.1). The image also
  # declares the test oracles the parity gate relies on.
  shell:
    name: tauri shell cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System deps and test oracles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config libssl-dev xvfb \
            openssl xmlsec1 libxml2-utils zip
          openssl version
          xmlsec1 --version
          xmllint --version
          zip -v | sed -n '2p'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Same probes the in-app diagnostics page runs; WebCrypto in node is not the
      # webview answer, it only keeps the probe code honest.
      - run: pnpm exec vitest run src/lib/diagnostics.test.ts
