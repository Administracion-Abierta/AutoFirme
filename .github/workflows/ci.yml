name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Debian trixie (OpenSSL 3.5) instead of the runner image (OpenSSL 3.0: the fixture
    # generator in src/test/fixtures.ts needs >= 3.4 for `-not_before`/`-not_after`).
    container:
    # node:24-trixie = debian:trixie (OpenSSL 3.5) + node preinstalled. A plain trixie
    # image has no node, so every node-based action (checkout, setup-node, pnpm) dies
    # with `crun: executable file 'node' not found in $PATH` before step 2.
      image: node:24-trixie
    steps:
      # node:24-trixie ships node/git/python3/unzip; apt only adds the test oracles.
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openssl unzip zip python3 ca-certificates xmlsec1 libxml2-utils
          # The workspace is mounted from the host; without this, git refuses to read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          openssl version
          xmlsec1 --version
          xmllint --version
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # All five version files must agree before anything is packaged (see check-versions.mjs).
      - run: pnpm check:versions
      # Webapp plus extension suites; the extension tests need no build output.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:extension
      - run: pnpm check:extension
      # Cross-checks against tools that did not write the artifacts: Info-ZIP for
      # the batch archive, openssl/python3 for every fixture (positive and negative).
      - run: pnpm verify:zip
      - run: bash test/fixtures/verify-fixtures.sh
      # 50 MB PDF, 500-file batch and cold start; absolute ceilings calibrated on a dev box.
      - run: pnpm perf
      - run: pnpm package:extension
      - uses: actions/upload-artifact@v3
        with:
          name: autofirme-extension
          path: |
            dist/autofirme-extension-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # The node sidecar used to run in no workflow at all; it is part of the pnpm
  # workspace now, so the same install covers it.
  mcp:
    name: mcp check, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same OpenSSL floor as `checks`: `mcp/test/helpers.ts` builds the shared CAdES fixtures,
    # whose expired leaf needs `-not_before`/`-not_after` (OpenSSL >= 3.4) — absent on the runner.
    container:
      image: node:24-trixie
    steps:
      # node:24-trixie ships node/git; apt only adds the OpenSSL fixture oracle.
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openssl ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          openssl version
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # mcp tests import ../../src/lib/*, so vite loads the root tsconfig.json, which
      # extends $app/tsconfig — generated by svelte-kit sync (the root job gets it for
      # free from the sveltekit vite plugin; this job's node-env vitest does not).
      - run: pnpm -s exec svelte-kit sync
      - run: pnpm --filter autofirme-mcp check
      - run: pnpm --filter autofirme-mcp build
      - run: pnpm --filter autofirme-mcp test
      # Builds both entry points and verifies a stdio signature with openssl cms -verify.
      - run: pnpm --filter autofirme-mcp e2e

  # P0 shell gate (#19): the job runs on the builder container. Rocky 9.8 ships only
  # webkit2gtk 4.0, which wry cannot use, and the runner image ships OpenSSL 3.0 while
  # the parity gate declares `openssl` >= 3.4; trixie has webkit2gtk-4.1 and OpenSSL 3.5.
  shell:
    name: tauri shell check and webview smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: node:24-trixie
    steps:
      # node:24-trixie ships git/node; apt adds the native build chain and test oracles.
      - name: Toolchain and test oracles
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential curl ca-certificates pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xauth \
            openssl xmlsec1 libxml2-utils zip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          openssl version
          xmlsec1 --version
          xmllint --version
          zip -v | sed -n '2p'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # P5.1 sidecar (Refs #107): `bundle.externalBin` makes tauri-build abort
      # `cargo check` when `src-tauri/binaries/autofirme-mcp-<triple>` is missing, and
      # no other CI step builds it (the 70 MB artifact is gitignored build output).
      - uses: oven-sh/setup-bun@v2
      - run: pnpm --filter autofirme-mcp build:binary
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # P0.6 headless smoke: the production build embeds `build/` and serves it over the
      # `tauri://localhost` custom scheme. The marker proves the webview really booted and
      # finished a page load; `timeout` fails the job when it never gets there.
      - run: pnpm build:tauri
      - name: Headless webview smoke
        run: |
          set -o pipefail
          cargo build --release --locked --features tauri/custom-protocol \
            --manifest-path src-tauri/Cargo.toml
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 AUTOFIRME_SMOKE=1
          timeout 120 xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ./src-tauri/target/release/autofirme-desktop | tee smoke.log
          grep -q "SHELL_SMOKE Finished" smoke.log
      - uses: actions/upload-artifact@v3
        with:
          name: shell-smoke
          path: smoke.log
          if-no-files-found: error
