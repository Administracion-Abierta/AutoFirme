name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-check even when nothing is pushed: new advisories land on old
    # lockfiles. Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production tree is what ships the client-side crypto (pdf-lib, fflate);
      # dev deps get updated by Dependabot instead. High+ severities fail the
      # job; Dependabot opens the fix PRs.
      - run: pnpm audit --prod --audit-level=high
