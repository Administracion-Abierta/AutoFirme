name: Release

# Runs on the GitHub release that Release Please publishes, never on a plain tag: the
# release PR is what keeps package.json, extension/manifest.json and CHANGELOG.md in step.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifacts:
    name: build and attach release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release that bumps only one of the two version fields must not ship.
      - run: node scripts/check-versions.mjs ${{ github.event.release.tag_name }}
      - run: pnpm build
      - run: pnpm build:extension
      - run: pnpm package:extension
      # Issue #3: build the package twice from scratch; a change that breaks the
      # reproducibility of package-extension.py must fail here, before upload.
      - name: Verify packaging reproducibility (build twice, compare SHA256SUMS)
        run: |
          cp dist/SHA256SUMS sums-a.txt
          rm -rf dist build .svelte-kit
          pnpm build
          pnpm build:extension
          pnpm package:extension
          diff sums-a.txt dist/SHA256SUMS
      - name: Pack the static site
        run: tar -czf dist/autofirme-web-${{ github.event.release.tag_name }}.tar.gz -C build .
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/autofirme-extension-*.zip dist/SHA256SUMS dist/autofirme-web-*.tar.gz --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/autofirme-extension-*.zip
            dist/SHA256SUMS
            dist/autofirme-web-*.tar.gz
          if-no-files-found: error

  # Issue #3: site image (Containerfile, node -> caddy) to ghcr.io with the same
  # release. needs: artifacts -> the reproducibility gate must pass first.
  image:
    name: push site image to ghcr.io
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # self-host (k3s) es x86_64; anyadir platforms aqui si aparece destino arm.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
