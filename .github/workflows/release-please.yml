name: Release Please

# Conventional commits merged into main become a release PR (version bump in
# package.json, extension/manifest.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml and
# src-tauri/Cargo.lock + CHANGELOG.md). Merging that PR tags vX.Y.Z
# and publishes a GitHub release, which is what triggers `release.yml`.
#
# GitHub-only: the action talks to api.github.com and needs a GitHub token.
# On Forgejo releases stay manual (the procedure the 0.2.0 release used):
# pointing the action at the Forgejo API made its token 401 against
# api.github.com, and Forgejo lacks the GraphQL surface release-please needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
