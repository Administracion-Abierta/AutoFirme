name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff scans need the base..head history present locally; the repo is
          # small enough to fetch whole.
          fetch-depth: 0
      # gitleaks CLI straight from the release: gitleaks-action needs an org
      # license token we do not have. Rules: defaults + .gitleaks.toml allowlist.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          v=8.30.1
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan pushed range
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            ./gitleaks git --pre-commit --log-opts="${{ github.event.before }}..${{ github.sha }}" --no-banner --redact
          else
            # New branch or force-push: event.before is absent — scan full history.
            ./gitleaks git --no-banner --redact
          fi
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          ./gitleaks git --pre-commit --log-opts="origin/${{ github.base_ref }}..HEAD" --no-banner --redact
