<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#008d80" />
		<meta
			name="description"
			content="AutoFirma Web — firma electrónica 100% en el navegador / browser-only electronic signature"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// shadcn-svelte's dark mode is class-based. The stored preference (light, dark or system)
			// is applied before the first paint so a dark-mode user never sees a white flash; the app
			// writes the same key from its theme switcher.
			const THEME_KEY = 'autofirme-theme';
			const media = matchMedia('(prefers-color-scheme: dark)');
			const apply = () => {
				const mode = localStorage.getItem(THEME_KEY) ?? 'system';
				document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'system' && media.matches));
			};
			apply();
			media.addEventListener('change', apply);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
